name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            projects/*/requirements*.txt

      - name: Install monorepo and per-project dependencies
        run: |
          pip install -r requirements-dev.txt
          for req in projects/*/requirements-dev.txt projects/*/requirements.txt; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done

      - run: pytest
